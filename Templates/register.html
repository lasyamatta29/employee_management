<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        body{
            font-family:arial, sans-serif;
            background-color: #f4f7fc;
        }
        /*Navbar*/
        .navbar{
            background-color:rgb(235, 140, 231);
            padding: 15px 30px;
            display:flex;
            align-items:center;
            justify-content: space-between;
        }
        /*logo*/
        .logo{
            color: #3a042a;
            font-size: 22px;
            font-weight: bold;
        }
        /*Navigation links*/
        .nav-links{
            display:flex;
            align-items: center;
            list-style:none;
            gap:20px;
            color: #3a042a;
        }
        .nav-links a:hover{
         color: #681a68;
         text-decoration: none;
         font-size: 16px;
         padding: 8px 12px;
         border-radius: 5px;
         
        }
        /*login button*/
        .login1-btn{
            background-color: #74196e;
            padding: 8px 15px;
            border-radius: 5px;
            color: antiquewhite;
        }
        .login1-btn:hover{
            background-color:#f092c4;
            color:rgb(44, 2, 29)!important;
        }
        /*Register butter*/
        .register-btn{
            background-color:#74196e;;
            padding: 8px 15px;
            border-radius:5px ;
            color: antiquewhite;
        }
        .register-btn:hover{
            background-color: #f092c4;
            color:rgb(44, 2, 29)!important;
        }
        /*content*/
        .content{
            padding:50px;
            text-align: center;
        }
        /*theme buttons*/
        .theme-buttons{
                display:flex;
                gap:10px;
                margin-right:20px;
        }
        .theme-buttons a{
                     color:white;
                     text-decoration:none;
                     border:1px solid #00bcd4;
                     border-radius: 5px;
                     font-size: 14px;
        }
        .theme-buttons a:hover{
            background-color: #00bcd4;
        }        
        /* lightmode */
        body.light{
            background-color: #f5f5f5;
            color: #222;
        }   
        body.light.content{
             background-color: #f5f5f5;
             color: #222;
        }
        body.light.content h1{
            color: #222;
        }
        body.light.content p{
            color: #555;
        }
    </style>    
</head>
<body>
    <nav class="navbar">
    <div class="logo">
        Employee Management System
    </div>
    
    <div id="theme-buttons">
        
        <a href="/set-theme/light">
        Light
        </a>
       <a href="/set-theme/dark">
        Dark
       </a>
    </div>
    <ul class="nav-links">
     <li>
        <a href="/home">
                Home
        </a>
     </li>
     <li>
        <a href="/employees">
            Employee
        </a>
     </li>    
     <li>
        <a href="/addemployee">
            Add Employee
        </a>
     </li>
     <li>
        <a href="/search">
            Search
        </a>
     </li>   
    <li>
        <a href="/register">
            <button type="submit" class="register-btn">Register</button>
        </a>
     </li>
     <li>
        <a href="/login1">
          <button type="submit" class="login1-btn">Login</button>
        </a>
     </li>
     </ul>
    </nav>
    <div><br><br>
        <h1>Registration Form</h1>
    </div>
    <form id="Registrationform" action="/register" method="post">
        <label >Fullname</label><br>
        <input type="text" id="fullname" name="fullname" required ><br><br>
        <label >Username:</label><br>
        <input type="text" id="username" name="username"  required ><br><br>
        <label >Password:</label><br>
        <input type="password" id="password" name="password"  required><br><br>
        <button type="submit" value="Register">Register</button>
          <button type="reset" value="reset">Reset</button>
    </form>
</body>
</html>
