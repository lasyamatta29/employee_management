<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: aliceblue;
        }
        h1{
           text-align: center;
           color: #983276;
           margin-top: 40px;
           margin-bottom: 25px;
        }
        form{
            width: 400px;
            margin: auto;
            background-color:rgb(248, 149, 217);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        label{
            color: #302;
            font-weight: bold;
        }
        input[text="text"],
        input[text="password"]{
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 18px;
        }
        input[type="text"]:focus,
        input[type="password"]:focus{
            border-color: #8e44ad;
            outline: none;
            padding: 7px;
        }
        .register-btn,
        .reset-btn{
            width: 100px;
            padding: 10px 20x;
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }
        .register-btn{
            background-color: #470537;
            padding: 5px;
        }
        .reset-btn{
            background-color: #470537;
            margin-left: 10px;
            padding: 5px;

        }
        .register-btn:hover{
            background-color: #732d91;
        }
        .reset-btn:hover{
            background-color: #732d91;
        }
        /*theme buttons*/
        .theme-buttons{
                display:flex;
                gap:10px;
                margin-right:20px;
        }
        .theme-buttons a{
                     color:white;
                     text-decoration:none;
                     border:1px solid #00bcd4;
                     border-radius: 5px;
                     font-size: 14px;
        }
        .theme-buttons a:hover{
            background-color: #00bcd4;
        }        
        /* lightmode */
        body.light{
            background-color: #f5f5f5;
            color: #222;
        }   
        body.light .content{
             background-color: #f5f5f5;
             color: #222;
        }
        body.light .content h1{
            color: #222;
        }
        body.light .content p{
            color: #555;
        }
        body.dark{
            background-color: #121212;
            color: white;
        }   
        body.dark .content{
             background-color:#1e1e1e;
             color:white ;
        }
        body.dark .content h1{
            color: white;
        }
        body.dark .content p{
            color:#ddd;
        }
        button{
            padding: 5px;
            background-color: rgb(214, 36, 146);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>    
</head>
<body class="{{ theme }}">
    <div id="theme-buttons">
        
        <a href="/set-theme/light">
         <button> ☀ Light </button>
        </a>
       <a href="/set-theme/dark">
         <button> 🌙 Dark </button>
       </a>
    </div>
    <br><br>
        <h1>Registration Form</h1>
    </div>
    <form id="Registrationform" action="/register" method="post">
        <label >Fullname</label><br>
        <input type="text" id="fullname" name="fullname" placeholder="Enter your Fullname" required ><br><br>
        <label >Username:</label><br>
        <input type="text" id="username" name="username" placeholder="Enter your username" required ><br><br>
        <label >Password:</label><br>
        <input type="password" id="password" name="password" placeholder="Enter your password"  required><br><br>
        <button type="submit" value="Register" class="register-btn">Register</button>
        <button type="reset" value="reset" class="reset-btn">Reset</button>
    </form>
</body>
</html>
