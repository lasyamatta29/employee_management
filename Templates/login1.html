<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: aliceblue ;
            text-align: center;
        }
        h1{
            color: #983276;
            margin-top: 50px;
        }
        form{
            background-color: rgb(239, 113, 206);
            width: 350px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        label{
            color: #45033a;
            font-weight: bold;
        }
        input[type="text"],
        input[type="password"]{
            width: 90%;
            padding: 10px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .loginbtn,
        .resetbtn{
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
        }
        .loginbtn{
            background-color:#42043a;
        }
        .resetbtn{
            background-color: #42043a;
            margin-left: 10px;
        }
        .loginbtn:hover{
            background-color: #cf068f;
        }
        .resetbtn:hover{
            background-color: #cf068f;
        }
        /*theme buttons*/
        .theme-buttons{
                display:flex;
                gap:10px;
                margin-right:20px;
        }
        .theme-buttons a{
                     color:white;
                     text-decoration:none;
                     border:1px solid #00bcd4;
                     border-radius: 5px;
                     font-size: 14px;
        }
        .theme-buttons a:hover{
            background-color: #00bcd4;
        }        
        /* lightmode */
        body.light{
            background-color: #f5f5f5;
            color: #222;
        }   
        body.light .content{
             background-color: #f5f5f5;
             color: #222;
        }
        body.light .content h1{
            color: #222;
        }
        body.light .content p{
            color: #555;
        }
        body.dark{
            background-color: #121212;
            color: white;
        }   
        body.dark .content{
             background-color:#1e1e1e;
             color:white ;
        }
        body.dark .content h1{
            background-color:#1e1e1e;
            color: white;
        }
        body.dark .content p{
            color:#ddd;
        }
        button{
            padding: 5px;
            background-color: rgb(214, 36, 146);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>
<body class="{{ theme }}">
    <div id="theme-buttons">
        
        <a href="/set-theme/light">
          <button>☀ Light</button>
        </a>
       <a href="/set-theme/dark">
         <button>🌙 Dark</button>
       </a>
    </div>
    <br><br>
    <h1>Login</h1>
    <form id="loginform" action="/login1" method="post">
        <label>Username:</label><br>
        <input type="text" id="username" name="username" placeholder="Enter Username" required>
        <br><br>
        <label>Password:</label><br>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
        <br><br>
        <button type="submit" value="register" class="loginbtn">Login</button>
        <button type="reset" value="reset" class="resetbtn">Reset</button>
    </form>
    <!-- <----register------- -->
     <div class="regiter-link">
        Don't have an account?
        <a href="/register">
            Register
        </a>

     </div>
     <!-- {% with messages = get_flashed_messages() %} 
  {% if messages %}
    <ul>
      {% for msg in messages %}
        <li>{{ msg }}</li>
      {% endfor %}
    </ul>
  {% endif %}
{% endwith %}-->

</body>
</html>
